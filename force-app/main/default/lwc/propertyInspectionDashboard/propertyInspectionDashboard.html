<template>

    <!-- Display loading spinner while data is being retrieved -->
    <template if:true={isLoading}>

        <lightning-spinner
            alternative-text="Loading"
            size="medium">
        </lightning-spinner>

    </template>

    <lightning-card title="Property Inspection Dashboard">

        <div class="slds-p-around_medium">

            <!-- Display error message when data retrieval fails -->
            <template if:true={errorMessage}>

                <div class="slds-text-color_error slds-m-bottom_medium">

                    {errorMessage}

                </div>

            </template>

            <!-- Display average inspection rating -->
            <div class="slds-m-bottom_medium">

                <p class="slds-text-title_bold">

                    Average Rating

                </p>

                <div class="rating-container">

                    <div class="rating-value">
                        {averageRatingDisplay}
                    </div>

                    <div class="stars">

                        <template
                            for:each={averageStars}
                            for:item="star">

                            <span
                                key={star.index}
                                class={star.className}>
                                ★
                            </span>

                        </template>

                    </div>

                </div>

            </div>

            <!-- Filter section -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">

                <div class="slds-col">

                    <lightning-combobox
                        label="Status"
                        value={selectedStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>

                </div>

                <div class="slds-col">

                    <lightning-combobox
                        label="Inspection Type"
                        value={selectedType}
                        options={typeOptions}
                        onchange={handleTypeChange}>
                    </lightning-combobox>

                </div>

            </div>

            <!-- Action buttons -->
            <div class="slds-m-bottom_medium">

                <lightning-button
                    label="Schedule New Inspection"
                    variant="brand"
                    onclick={handleScheduleInspection}>
                </lightning-button>

            </div>

            <!-- Display inspection records -->
            <template if:true={hasInspections}>

                <template
                    for:each={inspections}
                    for:item="inspection">

                    <div
                        key={inspection.Id}
                        class="inspection-card slds-box slds-m-bottom_small">

                        <div class="slds-grid slds-wrap">

                            <div class="slds-col slds-size_1-of-2">

                                <strong>Date:</strong>
                                &nbsp;
                                {inspection.Inspection_Date__c}

                            </div>

                            <div class="slds-col slds-size_1-of-2">

                                <strong>Type:</strong>
                                &nbsp;
                                {inspection.Inspection_Type__c}

                            </div>

                            <div class="slds-col slds-size_1-of-2">

                                <strong>Inspector:</strong>
                                &nbsp;
                                {inspection.Name}

                            </div>

                            <div class="slds-col slds-size_1-of-2">

                                <strong>Rating:</strong>
                                &nbsp;
                                {inspection.ratingStars}

                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-m-top_small">

                                <span class={inspection.statusClass}>

                                    {inspection.Inspection_Status__c}

                                </span>

                            </div>

                        </div>

                    </div>

                </template>

            </template>

            <!-- Display message when no inspections exist -->
            <template if:false={hasInspections}>

                <div class="slds-text-align_center">

                    No inspections found.

                </div>

            </template>

        </div>

    </lightning-card>

    <!-- Display flow modal when scheduling a new inspection -->
    <template if:true={showFlow}>

        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- Modal header -->
                <header class="slds-modal__header">

                    <h2 class="slds-text-heading_medium">

                        Schedule Property Inspection

                    </h2>

                </header>

                <!-- Flow container -->
                <div class="slds-modal__content slds-p-around_medium" >

                    <lightning-flow
                        flow-api-name="Schedule_Property_Inspection"
                        flow-input-variables={flowInputVariables}
                        onstatuschange={handleFlowStatusChange}>
                    </lightning-flow>

                </div>

                <!-- Modal footer -->
                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Close"
                        onclick={closeModal}>
                    </lightning-button>

                </footer>

            </div>

        </section>

        <!-- Display modal backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
